<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CayLink — cross-agency emergency resource coordination, Detroit</title>
<meta name="description" content="CayLink — a shared resource registry for Detroit emergency response. See what every agency has, where it is, and who is holding it." />
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.3.0/maplibre-gl.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.3.0/maplibre-gl.min.js"></script>
<style>
  :root{
    --bg:#0B0D10; --panel:#14171C; --panel2:#1A1E24; --line:rgba(235,235,245,.13);
    --text:#EDEFF2; --mute:#98A1AE;
    --alert:#E5484D; --ready:#3FBF7F; --pending:#E8B339;
    --tech:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden}

  header{position:absolute;top:0;left:0;right:0;z-index:5;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
    background:linear-gradient(180deg,rgba(11,13,16,.96),rgba(11,13,16,.72) 70%,transparent);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mark{font-size:17px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .mark b{color:var(--alert)}
  .demo{font-family:var(--tech);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;
    color:var(--pending);border:1px solid rgba(232,179,57,.4);border-radius:999px;padding:3px 8px}

  #map{position:absolute;inset:0}

  /* Tall enough to open all the way: the sheet's natural height is now most of the screen, and
   the detents decide how much of it you see. Opening fully is as available as closing fully —
   an asymmetric control is one people stop trusting. */
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;height:92%;
    transform:translateY(var(--sheetY,0px));
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    background:var(--panel);border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;display:flex;flex-direction:column;
    box-shadow:0 -14px 40px rgba(0,0,0,.5);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  /* The grip is a real handle: drag it, or tap it to cycle. Collapsing it is also how you get a
     full-screen map — one mechanic, two needs, rather than a separate expand button. */
  .grip{width:100%;padding:9px 0 5px;flex:0 0 auto;cursor:grab;touch-action:none}
  .grip::after{content:"";display:block;width:38px;height:4px;border-radius:3px;
    background:rgba(235,235,245,.22);margin:0 auto}
  #sheet.dragging{transition:none}
  #sheet.dragging .grip::after{width:54px;background:rgba(235,235,245,.5)}
  .bar{display:flex;gap:8px;align-items:center;padding:6px 14px 10px;flex-wrap:wrap;flex:0 0 auto}
  .bar input,.bar select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit}
  .bar input{flex:1;min-width:120px}
  .btn{background:var(--alert);color:#fff;border:none;border-radius:9px;padding:9px 14px;
    font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    font-weight:600;min-width:44px;font-size:18px;line-height:1;padding:9px 12px}
  #list{overflow-y:auto;padding:0 14px 16px;-webkit-overflow-scrolling:touch}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;margin-bottom:8px;cursor:pointer}
  .card:active{border-color:var(--alert)}
  .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .name{font-weight:700;font-size:14.5px}
  .meta{font-family:var(--tech);font-size:11px;color:var(--mute);margin-top:3px;line-height:1.45}
  .pill{font-family:var(--tech);font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;
    padding:4px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
  .available{background:rgba(63,191,127,.15);color:var(--ready)}
  .committed{background:rgba(229,72,77,.15);color:var(--alert)}
  .en_route{background:rgba(232,179,57,.15);color:var(--pending)}
  .out_of_service{background:rgba(152,161,174,.15);color:var(--mute)}
  .stale{color:var(--pending)}
  .empty{color:var(--mute);font-size:14px;padding:14px 2px}

  #add{position:absolute;inset:0;z-index:9;background:rgba(6,8,10,.86);display:none;
    align-items:flex-end}
  #add.on{display:flex}
  .modal{width:100%;background:var(--panel);border-radius:18px 18px 0 0;
    border-top:1px solid var(--line);
    padding:16px 16px calc(34px + env(safe-area-inset-bottom,0px));
    max-height:86%;overflow-y:auto}
  .modal h3{margin:4px 0 10px;font-size:16px}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-family:var(--tech);font-size:10px;letter-spacing:1.1px;
    text-transform:uppercase;color:var(--mute);margin-bottom:4px}
  .fld input,.fld select{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:10px;font-size:15px;font-family:inherit}
  .two{display:flex;gap:10px}.two .fld{flex:1}
  .hint{font-size:12px;color:var(--mute);margin:-2px 0 12px;line-height:1.45}
  /* Version badge. Same reason ConeWatch has one: without it you cannot tell whether the page
     in front of you is the build you just uploaded, and you end up debugging a cached copy. */
  .ver{font-family:var(--tech);font-size:9.5px;letter-spacing:1.1px;color:var(--alert);
    border:1px solid rgba(229,72,77,.4);border-radius:999px;padding:3px 8px}
  #coords{margin-left:auto;font-family:var(--tech);font-size:10.5px;color:var(--mute);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;
    white-space:nowrap}
  #coords:active{color:var(--text);border-color:var(--ready)}
  #aiBtn{font-family:var(--tech);font-size:10.5px;letter-spacing:1.1px;cursor:pointer;
    border-radius:999px;padding:4px 10px;background:transparent;color:var(--mute);
    border:1px solid var(--line)}
  #aiBtn.on{color:#C4B5FD;border-color:#6E56CF;background:rgba(110,86,207,.14)}
  .btn.ask{background:#6E56CF}
  #answer{padding:0 14px;color:var(--text);font-size:14px;line-height:1.55}
  #answer .box{background:rgba(110,86,207,.10);border:1px solid rgba(110,86,207,.35);
    border-left:3px solid #6E56CF;border-radius:11px;padding:11px 13px;margin-bottom:10px}
  #answer .box b{color:#C4B5FD}
  #answer .why{display:block;margin-top:7px;font-family:var(--tech);font-size:10.5px;
    color:var(--mute);letter-spacing:.3px}
  #status{position:absolute;inset:0;z-index:9;background:rgba(6,8,10,.86);display:none;
    align-items:flex-end}
  #status.on{display:flex}
  .stgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 4px}
  .stbtn{border:1px solid var(--line);border-radius:11px;padding:14px 10px;font-size:14.5px;
    font-weight:700;font-family:inherit;cursor:pointer;background:var(--panel2);color:var(--text)}
  .stbtn:active{transform:scale(.98)}
  .stbtn.available{color:var(--ready);border-color:rgba(63,191,127,.45)}
  .stbtn.en_route{color:var(--pending);border-color:rgba(232,179,57,.45)}
  .stbtn.committed{color:var(--alert);border-color:rgba(229,72,77,.45)}
  .stbtn.out_of_service{color:var(--mute)}
  .stbtn.current{outline:2px solid currentColor;outline-offset:-2px}
  #recent{padding:2px 14px 10px;display:none}
  #recent.on{display:block}
  #recent .rhead{font-family:var(--tech);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--mute);margin-bottom:6px}
  #recent .chip{display:inline-block;font-size:12px;background:var(--panel2);
    border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin:0 6px 6px 0;
    color:var(--text)}
  #recent .chip i{font-style:normal;font-family:var(--tech);font-size:10px;color:var(--mute);
    margin-left:5px}
  #req{position:absolute;inset:0;z-index:9;background:rgba(6,8,10,.86);display:none;
    align-items:flex-end}
  #req.on{display:flex}
  #openreqs{padding:0 14px;display:none}
  #openreqs.on{display:block}
  .rq{background:rgba(229,72,77,.09);border:1px solid rgba(229,72,77,.38);
    border-left:3px solid var(--alert);border-radius:11px;padding:11px 13px;margin-bottom:9px}
  .rq .t{font-weight:700;font-size:14px}
  .rq .m{font-family:var(--tech);font-size:11px;color:var(--mute);margin-top:3px;line-height:1.45}
  .rq .acts{display:flex;gap:8px;margin-top:9px}
  .rq .acts button{flex:1;border-radius:9px;padding:9px;font-size:13px;font-weight:700;
    font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);
    color:var(--text)}
  .rq .acts .ok{background:var(--ready);border-color:var(--ready);color:#06210f}
  .rq .acts .no{color:var(--alert);border-color:rgba(229,72,77,.45)}
  .sub{font-size:11.5px;color:var(--mute);flex-basis:100%;margin-top:-2px}
  #mine{padding:0 14px;display:none}
  #mine.on{display:block}
  #mine .card{border-color:rgba(110,86,207,.4);background:rgba(110,86,207,.09)}
  #mine .hd{font-family:var(--tech);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--mute);margin:2px 0 7px}
  #mine .nx{margin-top:9px;width:100%;border:none;border-radius:9px;padding:10px;
    font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;
    background:#6E56CF;color:#fff}
  /* Given a visual budget, spend it here. This is the payoff of the whole chain — the moment the
     system says "this is real, and here is who says so". Everything else stays quiet so this
     reads as the finished thing. */
  .vb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;padding:8px 11px;
    border-radius:9px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(63,191,127,.16),rgba(110,86,207,.14));
    border:1px solid rgba(63,191,127,.42)}
  .vb::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);
    transform:translateX(-120%);animation:sheen 4.2s ease-in-out infinite}
  @keyframes sheen{0%,72%{transform:translateX(-120%)}88%,100%{transform:translateX(120%)}}
  @media (prefers-reduced-motion:reduce){.vb::after{animation:none}}
  .vk{width:16px;height:16px;border-radius:50%;flex:0 0 auto;position:relative;
    background:var(--ready);box-shadow:0 0 0 3px rgba(63,191,127,.22)}
  .vk::after{content:"";position:absolute;left:5px;top:2.5px;width:4px;height:8px;
    border:solid #06210f;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .vt{font-size:12.5px;font-weight:700;color:var(--ready);letter-spacing:.2px}
  .vw{font-family:var(--tech);font-size:10.5px;color:var(--mute);letter-spacing:.4px;
    text-transform:uppercase}
  .vn{flex-basis:100%;font-size:12px;color:var(--mute);line-height:1.4}
  .fld{position:relative}
  .acbox{display:none;position:absolute;left:0;right:0;top:100%;z-index:12;margin-top:4px;
    background:#1A1E24;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .acbox.on{display:block}
  .acrow{padding:10px 12px;font-size:13.5px;cursor:pointer;color:var(--mute);
    border-bottom:1px solid rgba(235,235,245,.06)}
  .acrow:last-child{border-bottom:none}
  .acrow b{color:var(--text);font-family:var(--tech);font-size:12px;margin-right:6px}
  .acrow:active{background:var(--panel2)}
  .held{background:rgba(110,86,207,.10);border:1px solid rgba(110,86,207,.32);
    border-radius:10px;padding:10px 12px;margin:2px 0 10px;font-size:13.5px;line-height:1.5}
  .held b{color:#C4B5FD}
  .arrived{background:rgba(110,86,207,.15);color:#C4B5FD}
  /* the commit confirmation is the moment the app has to feel real — loud, timestamped, brief */
  /* Moved from the bottom to the top. The bottom of this screen holds the sheet, the list and
     the user's thumb; the top is empty map. It is also where the eye lands after a sheet closes,
     which is exactly when a confirmation needs to be read. */
  #toast{position:fixed;left:50%;top:calc(var(--hdrH,74px) + env(safe-area-inset-top,0px));
    transform:translate(-50%,-160%);z-index:30;max-width:min(620px,94vw);width:max-content;
    background:#1A1E24;border:1px solid var(--line);border-left:3px solid var(--pending);
    color:var(--text);border-radius:11px;padding:11px 14px;font-size:13.5px;line-height:1.45;
    box-shadow:0 12px 34px rgba(0,0,0,.55);transition:transform .26s cubic-bezier(.32,.72,0,1);
    pointer-events:none;display:flex;gap:10px;align-items:flex-start}
  #toast.on{transform:translate(-50%,0)}
  #toast.ok{border-left-color:var(--ready)}
  #toast.err{border-left-color:var(--alert);pointer-events:auto;cursor:pointer}
  #toast .x{font-family:var(--tech);font-size:11px;color:var(--mute);margin-left:4px}
</style>
</head>
<body>

<div id="map"></div>

<header>
  <span class="mark">Cay<b>Link</b></span>
  <span class="ver" id="ver">v3.4</span>
  <span class="demo">Demonstration data</span>
  <span class="sub">Shared resource registry for Detroit emergency response</span>
  <span id="coords" title="Tap to copy">—</span>
  <button id="aiBtn" title="Plain-language questions">AI</button>
</header>

<div id="sheet">
  <div class="grip"></div>
  <!-- One box. Typing a question, an address, or coordinates all go through the same control,
       because from the user's side those are the same act: "tell me what's near this". Two
       separate inputs made the user decide which kind of thing they were about to type before
       they had typed it. -->
  <div class="bar">
    <input id="q" placeholder="What do you need, and where?" />
    <button class="btn" id="go">Find</button>
    <button class="btn ghost" id="addBtn">+</button>
  </div>
  <div id="answer"></div>
  <!-- A commander coming on shift asks one question first: what moved while I was away. The
       registry already knows — updated_at is the answer — so surfacing it costs nothing and is
       the clearest argument for why keeping status current matters. -->
  <div id="recent"></div>
  <!-- Open requests sit ABOVE everything. An unanswered ask is the only thing in this app with
       someone waiting on the other end of it. -->
  <div id="openreqs"></div>
  <!-- A commit is a receipt, not a notification: if your agency is holding something, that fact
       should stay on screen with its next action, not scroll away behind a timer. -->
  <div id="mine"></div>
  <div id="list"><div class="empty">Loading resources…</div></div>
</div>

<!-- ═══════════ STATUS ═══════════
     Adding a resource is the easy half. The half that decides whether this is a living registry
     or a stale directory is whether anyone comes BACK and changes it — a pump that was available
     at 6pm and committed at 6:40 is the entire point. So changing status is one tap from the
     list, not buried in an edit form: the action that has to happen a hundred times a night is
     the action that has to be cheapest. -->
<!-- ═══════════ THE CHAIN ═══════════
     One sheet, and what it shows depends entirely on where the resource is in its life. There is
     never a menu of statuses to pick from, because picking a status is not a thing anyone does in
     an incident — they do a thing, and the status follows. Available is never offered: it is what
     a resource IS when nothing holds it. -->
<div id="status">
  <div class="modal">
    <h3 id="st_name">Resource</h3>
    <p class="hint" id="st_meta"></p>
    <div id="st_body"></div>
    <button class="btn ghost" id="st_close" style="width:100%;margin-top:6px">Close</button>
  </div>
</div>

<div id="add">
  <div class="modal">
    <h3>Add a resource</h3>
    <p class="hint">Posted to the shared registry. Anyone responding to an incident nearby
    will see it.</p>
    <div class="fld"><label>Agency</label><input id="f_agency" placeholder="DFD Engine 30" /></div>
    <div class="fld"><label>Resource</label><input id="f_name" placeholder="Portable pump, 4in" /></div>
    <div class="two">
      <div class="fld"><label>Type</label>
        <select id="f_kind">
          <option value="pump">Pump</option><option value="generator">Generator</option>
          <option value="light">Lighting</option><option value="vehicle">Vehicle</option>
          <option value="shelter">Shelter</option><option value="crew">Crew</option>
        </select>
      </div>
      <div class="fld"><label>Status</label>
        <select id="f_status">
          <option value="available">Available</option><option value="en_route">En route</option>
          <option value="committed">Committed</option><option value="out_of_service">Out of service</option>
        </select>
      </div>
    </div>
    <div class="two">
      <div class="fld"><label>Capacity</label><input id="f_capacity" placeholder="1500 gpm" /></div>
      <div class="fld"><label>Contact</label><input id="f_contact" placeholder="Dispatch" /></div>
    </div>
    <p class="hint">Location is taken from the centre of the map — move the map to place it.</p>
    <div class="two">
      <button class="btn ghost" id="cancelAdd" style="flex:1">Cancel</button>
      <button class="btn" id="saveAdd" style="flex:1">Post resource</button>
    </div>
  </div>
</div>

<script>
/* ═══════════ CayLink — Detroit ═══════════
   CONFIG is the single source of truth. Every value the app needs is read from here and
   nowhere else — no second copy of a URL, a colour, or a status list anywhere in this file.
   Config that exists in two places drifts apart, and the resulting bug always looks like
   something else. Cheaper to never make the second copy. */
var CONFIG = {
  supabaseUrl: "https://uthusjzbffpvckemfscc.supabase.co",
  /* The ANON public key. It is meant to be here — Supabase designs it to be visible in browser
     code, and the row level security policies in setup.sql are what actually protect the data.
     NEVER put the service_role or sb_secret key here: those bypass RLS entirely. */
  supabaseKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0aHVzanpiZmZwdmNrZW1mc2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTA0NDQsImV4cCI6MjEwNTI2NjQ0NH0.MJEjL8lfJLFa89nCmNF4kM70Vxv__xVQaZvnjIkcxAM",
  /* ═══════════ NO API KEY LIVES IN THIS FILE ═══════════
     The repository is public. An OpenAI key committed to a public repo is scraped by bots —
     often within hours — and billed to the owner's card. So the key is never in the source:
     the app asks for it once and keeps it in this browser's localStorage, on this device only.
     That is still not how a production system works — there the model call sits behind a server
     function and the key never reaches a browser at all. But it is honest for a five-day build,
     it keeps a real credential out of a public repo, and anyone cloning this repo supplies
     their own key rather than spending mine. */
  openaiKey: (function(){ try{ return localStorage.getItem("cay_openai_key") || ""; }catch(e){ return ""; } })(),
  center: [-83.0458, 42.3314],
  zoom: 11.4,
  radiusM: 8000,
  staleMinutes: 120  // past this, a status is shown as unverified rather than current
};

/* Status labels and colours, defined once, keyed to the exact values the database CHECK
   constraint allows. Adding a status means schema.sql and this object — nowhere else. */
var STATUS = {
  available:      { label:"Available",      color:"#3FBF7F" },
  committed:      { label:"Committed",      color:"#E5484D" },
  en_route:       { label:"En route",       color:"#E8B339" },
  arrived:        { label:"On site",        color:"#6E56CF" },
  out_of_service: { label:"Out of service", color:"#98A1AE" }
};

var map, markers = [], rows = [], incidentMarker = null;

map = new maplibregl.Map({
  container:"map",
  style:{
    version:8,
    sources:{ osm:{ type:"raster",
      tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
      tileSize:256, attribution:"© OpenStreetMap contributors" } },
    layers:[
      { id:"bg", type:"background", paint:{ "background-color":"#0B0D10" } },
      /* Dark, desaturated basemap on purpose: the map is context, the resources are the
         content. A bright basemap competes with the markers, which is backwards for something
         read under stress. */
      { id:"osm", type:"raster", source:"osm",
        paint:{ "raster-brightness-max":0.42, "raster-saturation":-0.25, "raster-contrast":0.15 } }
    ]
  },
  center:CONFIG.center, zoom:CONFIG.zoom
});

function api(path, opts){
  if(!CONFIG.supabaseUrl || !CONFIG.supabaseKey) return Promise.reject(new Error("no-config"));
  opts = opts || {};
  opts.headers = Object.assign({
    "apikey": CONFIG.supabaseKey,
    "Authorization": "Bearer " + CONFIG.supabaseKey,
    "Content-Type": "application/json"
  }, opts.headers || {});
  return fetch(CONFIG.supabaseUrl + "/rest/v1/" + path, opts).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(t || ("HTTP " + r.status)); });
    return r.status === 204 ? null : r.json();
  });
}

function esc(s){ return String(s == null ? "" : s).replace(/[<>&"]/g, function(c){
  return { "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;" }[c]; }); }

/* The verification mark. "It arrived" and "it works" are different facts, and only the second
   matters to whoever asked for it. Attribution is the point: an anonymous "verified" is a
   rumour — "verified by DPD at 9:23 PM" is something you can act on, and something the wrong
   person can be held to afterwards. */
function verifiedBadge(r){
  if(!r.verified_by || !r.verified_at) return "";
  var t = "";
  try{ t = new Date(r.verified_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }catch(e){}
  return '<div class="vb"><span class="vk"></span>' +
         '<span class="vt">Verified operational</span>' +
         '<span class="vw">' + esc(r.verified_by) + (t ? (' · ' + t) : '') + '</span>' +
         (r.verified_note ? ('<span class="vn">' + esc(r.verified_note) + '</span>') : '') +
         '</div>';
}

function statusOf(k){ return STATUS[k] || { label:k, color:"#98A1AE" }; }

function clearMarkers(){ markers.forEach(function(m){ m.remove(); }); markers = []; }

/* Age, said the way a person would say it out loud. "492 minutes ago" is technically precise
   and practically useless — nobody converts that in their head, least of all at 3am. Hours and
   days past the first hour, plus the actual clock time, because "updated at 9:26 PM" is what
   gets repeated over a radio. One function, used by the list and by the facts handed to the
   model, so the app and the AI never describe the same row differently. */
function humanAge(mins, updatedAt){
  if(mins == null) return "";
  var rel;
  if(mins < 1)        rel = "just now";
  else if(mins < 60)  rel = mins + " min ago";
  else if(mins < 1440){
    var h = Math.floor(mins/60), m = mins % 60;
    rel = h + "h" + (m ? (" " + m + "m") : "") + " ago";
  } else {
    var d = Math.floor(mins/1440), hh = Math.floor((mins % 1440)/60);
    rel = d + "d" + (hh ? (" " + hh + "h") : "") + " ago";
  }
  var clock = "";
  if(updatedAt){
    try{
      clock = new Date(updatedAt).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
    }catch(e){}
  }
  return rel + (clock ? (" · " + clock) : "");
}

function fmtDist(m){
  if(m == null) return "";
  return m < 1609 ? (Math.round(m*3.28) + " ft") : ((m/1609).toFixed(1) + " mi");
}

function render(list){
  rows = list || [];
  var el = document.getElementById("list");
  clearMarkers();

  if(!rows.length){
    el.innerHTML = '<div class="empty">No resources match. Widen the filter, or add one.</div>';
    return;
  }

  el.innerHTML = rows.map(function(r,i){
    var age = (r.minutes_since_update != null) ? r.minutes_since_update : null;
    /* Age is always shown. A generator marked available six hours ago is a guess, not a fact,
       and in an incident a confident wrong answer is worse than an admittedly uncertain one.
       Past staleMinutes it is called out rather than quietly presented as current. */
    var ageTxt = humanAge(age, r.updated_at);
    var stale = (age != null && age > CONFIG.staleMinutes);
    var st = statusOf(r.status);
    return '<div class="card" data-i="'+i+'"><div class="row"><div>'+
      '<div class="name">'+esc(r.name)+'</div>'+
      '<div class="meta">'+esc(r.agency)+
        (r.distance_m != null ? (" · "+fmtDist(r.distance_m)) : "")+
        (r.capacity ? (" · "+esc(r.capacity)) : "")+'<br>'+
        (r.contact ? esc(r.contact) : "no contact listed")+
        (ageTxt ? (' · <span class="'+(stale?"stale":"")+'">'+ageTxt+(stale?" — unverified":"")+'</span>') : "")+
      '</div></div>'+
      '<span class="pill '+esc(r.status)+'">'+esc(st.label)+'</span>'+
      '</div>'+verifiedBadge(r)+'</div>';
  }).join("");

  renderRecent();
  loadMine();

  rows.forEach(function(r){
    var c = statusOf(r.status).color;
    var d = document.createElement("div");
    d.style.cssText = "width:14px;height:14px;border-radius:50%;border:2px solid #0B0D10;"+
      "background:"+c+";box-shadow:0 0 0 3px "+c+"33";
    markers.push(new maplibregl.Marker({ element:d, anchor:"center" })
      .setLngLat([r.lng, r.lat]).addTo(map));
  });

  Array.prototype.forEach.call(el.querySelectorAll(".card"), function(card){
    card.onclick = function(){
      var r = rows[+card.dataset.i];
      map.flyTo({ center:[r.lng, r.lat], zoom:15, duration:700 });
      openStatus(r);
    };
  });
}

/* Anything touched in the last hour. Deliberately a strip of chips rather than a second list:
   it is a glance, not a screen. */
/* What YOUR agency is holding right now, with its next action one tap away. This is the
   difference between a form you filled in and a system you are operating: the commitment stays
   in front of you until it is finished. */
function loadMine(){
  var el = document.getElementById("mine");
  if(!el) return;
  var who = me();
  if(!who){ el.className = ""; el.innerHTML = ""; return; }
  var held = rows.filter(function(r){
    return r.held_by && r.held_by.toLowerCase() === who.toLowerCase();
  });
  if(!held.length){ el.className = ""; el.innerHTML = ""; return; }
  el.className = "on";
  var NEXT = { committed:["Mark en route","en_route"], en_route:["Mark arrived","arrived"] };
  el.innerHTML = '<div class="hd">' + esc(who) + ' is holding ' + held.length +
    (held.length === 1 ? ' resource' : ' resources') + '</div>' +
    held.map(function(r, i){
      var n = NEXT[r.status];
      return '<div class="card" data-i="' + i + '">' +
        '<div class="row"><div><div class="name">' + esc(r.name) + '</div>' +
        '<div class="meta">' + esc(r.held_for || "") +
          (r.destination ? (' → ' + esc(r.destination)) : '') +
          (r.eta_minutes ? (' · ETA ' + r.eta_minutes + 'm') : '') + '</div></div>' +
        '<span class="pill ' + esc(r.status) + '">' + esc(statusOf(r.status).label) + '</span></div>' +
        (n ? '<button class="nx" data-to="' + n[1] + '">' + n[0] + '</button>'
           : '<button class="nx" data-to="check">On-site check</button>') +
        '</div>';
    }).join("");

  Array.prototype.forEach.call(el.querySelectorAll(".card"), function(card){
    var r = held[+card.dataset.i];
    var b = card.querySelector(".nx");
    if(!b) return;
    b.onclick = function(ev){
      ev.stopPropagation();
      var to = b.dataset.to;
      if(to === "check"){ openStatus(r); return; }     // the check needs a note and a verdict
      rpc("advance_resource", { in_id:r.id, in_actor:who, in_to:to })
        .then(function(){
          toastMsg((to === "en_route" ? "EN ROUTE · " : "ARRIVED · ") + r.name +
                   " · " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}), "ok");
          loadAll();
        })
        .catch(function(e){ toastMsg(e.message, "err"); });
    };
  });
}

function renderRecent(){
  var el = document.getElementById("recent");
  if(!el) return;
  var fresh = rows.filter(function(r){ return r.minutes_since_update != null && r.minutes_since_update <= 60; })
                  .sort(function(a,b){ return a.minutes_since_update - b.minutes_since_update; })
                  .slice(0,6);
  if(!fresh.length){ el.className = ""; el.innerHTML = ""; return; }
  el.className = "on";
  el.innerHTML = '<div class="rhead">Changed in the last hour</div>' +
    fresh.map(function(r){
      return '<span class="chip">' + esc(r.name) + ' → ' + esc(statusOf(r.status).label) +
             '<i>' + esc(humanAge(r.minutes_since_update, r.updated_at)) + '</i></span>';
    }).join("");
}

function withAge(list){
  return (list||[]).map(function(r){
    if(r.minutes_since_update == null && r.updated_at){
      r.minutes_since_update = Math.round((Date.now() - new Date(r.updated_at).getTime())/60000);
    }
    return r;
  });
}

function loadAll(){
  var kind = "";
  api("resources?select=*&order=updated_at.desc" + (kind ? ("&kind=eq."+kind) : ""))
    .then(function(d){ render(withAge(d)); })
    .catch(showError);
}

function searchNear(lat, lng, kinds){
  api("rpc/resources_near", { method:"POST", body:JSON.stringify({
      in_lat:lat, in_lng:lng, radius_m:CONFIG.radiusM, only_available:false }) })
    .then(function(d){
      d = withAge(d);
      if(kinds && kinds.length) d = d.filter(function(r){ return kinds.indexOf(r.kind) > -1; });
      render(d);
      if(incidentMarker) incidentMarker.remove();
      incidentMarker = new maplibregl.Marker({ color:"#E5484D" })
        .setLngLat([lng, lat]).addTo(map);
      map.flyTo({ center:[lng, lat], zoom:13, duration:700 });
    })
    .catch(showError);
}

function showError(e){
  var el = document.getElementById("list");
  el.innerHTML = (e && e.message === "no-config")
    ? '<div class="empty">Not connected yet — paste your Supabase URL and anon key into CONFIG at the top of index.html.</div>'
    : '<div class="empty">Could not reach the registry. '+esc(e && e.message)+'</div>';
}

/* ── Locating the incident ──
   Geocoding is the one part of this that depends on a service I do not control, and it is the
   part a demo runs on. So it degrades instead of failing:
     1. "lat,lng" typed directly — no network at all, always works
     2. Nominatim, tried in several phrasings, because it handles addresses well and
        intersections badly ("Jefferson and Chene" fails; "Jefferson & Chene" and
        "Jefferson St & Chene St" often succeed)
     3. If all of that fails, search from wherever the map is centred and say so
   The fallback matters more than the geocoder: an incident commander pointing at a spot on a
   map is a completely reasonable way to ask "what is near HERE", and it cannot break. */
function parseLatLng(s){
  var m = s.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);
  return m ? { lat:parseFloat(m[1]), lng:parseFloat(m[2]) } : null;
}

function geocodeVariants(q){
  /* Nominatim reads "and" as a word, not as an intersection operator. "&" it understands, and
     adding street suffixes helps it disambiguate. Tried in order, first hit wins. */
  var v = [];
  var amp = q.replace(/\s+and\s+/i, " & ");
  v.push(amp + ", Detroit, MI");
  if(/&/.test(amp)){
    var parts = amp.split("&").map(function(x){ return x.trim(); });
    if(parts.length === 2){
      v.push(parts[0] + " Street & " + parts[1] + " Street, Detroit, MI");
      v.push(parts[0] + " Ave & " + parts[1] + " St, Detroit, MI");
      v.push(parts[0] + ", Detroit, MI");     // fall back to the first street alone
    }
  }
  if(v.indexOf(q + ", Detroit, MI") === -1) v.push(q + ", Detroit, MI");
  return v;
}

function tryGeocode(list, i){
  if(i >= list.length) return Promise.resolve(null);
  return fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="+
               encodeURIComponent(list[i]))
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(d){
      if(d && d.length) return { lat:parseFloat(d[0].lat), lng:parseFloat(d[0].lon), used:list[i] };
      return tryGeocode(list, i+1);
    })
    .catch(function(){ return tryGeocode(list, i+1); });
}


/* A second, network-free way to ask the same question: long-press or right-click the map to
   treat that point as the incident. This is the one that cannot fail in a demo. */
map.on("contextmenu", function(e){ searchNear(e.lngLat.lat, e.lngLat.lng); });

/* ═══════════ COORDINATES, ALWAYS VISIBLE ═══════════
   The map centre in lat,lng, live, tappable to copy. Two reasons it earns its place: it makes
   the coordinate search path discoverable (you can see the format rather than being told it),
   and in an incident "where exactly" is a question people answer out loud over a radio. */
function fmtCoord(c){ return c.lat.toFixed(4) + "," + c.lng.toFixed(4); }
function updateCoords(){
  var el = document.getElementById("coords");
  if(el) el.textContent = fmtCoord(map.getCenter());
}
map.on("move", updateCoords);
map.on("load", updateCoords);
document.getElementById("coords").onclick = function(){
  var txt = fmtCoord(map.getCenter());
  try{
    navigator.clipboard.writeText(txt);
    toastMsg("Copied " + txt + " — paste it into the search box, or read it over the radio.");
  }catch(e){ toastMsg(txt); }
};

/* Long-press / right-click already sets the incident. Show the coordinate too, so the pin and
   the number always agree. */
map.on("contextmenu", function(e){ toastMsg("Incident set at " + fmtCoord(e.lngLat)); });

/* ═══════════ ASK — PLAIN LANGUAGE OVER THE REGISTRY ═══════════
   The honest description of what this does: it uses a language model to turn a sentence into a
   STRUCTURED QUERY, runs that query against Postgres, and then writes one sentence about the
   rows that came back. The model never invents a resource — every item shown came out of the
   database. That distinction is the whole reason this is trustworthy enough to put in front of
   someone making dispatch decisions, and it is worth saying out loud in the pitch: the AI
   chooses what to look for, the database decides what exists.
   Two calls, deliberately:
     1. sentence → {kind, status, location, radius}
     2. rows → one plain sentence
   A single call that did both would let the model answer from memory instead of from data. */
var ASK_MODEL = "gpt-4o-mini";

function askOpenAI(messages, maxTokens){
  if(!CONFIG.openaiKey) return Promise.reject(new Error("no-key"));
  return fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{ "Content-Type":"application/json",
              "Authorization":"Bearer " + CONFIG.openaiKey },
    body: JSON.stringify({ model:ASK_MODEL, messages:messages,
                           max_tokens:maxTokens||220, temperature:0 })
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(t.slice(0,160)); });
    return r.json();
  }).then(function(d){ return (d.choices && d.choices[0].message.content) || ""; });
}

var KINDS = ["pump","generator","light","vehicle","shelter","crew"];

function interpret(question){
  var sys = "You convert an emergency dispatcher's question into a JSON query against a " +
    "resource registry. Reply with JSON ONLY, no prose, no code fences. Shape: " +
    '{"kinds":[],"status":"available"|"any","place":"","radius_miles":5}. ' +
    "kinds must be a subset of: " + KINDS.join(", ") + ". " +
    "Map meaning to kind: water/flooding/pumping -> pump; power/electricity -> generator; " +
    "dark/visibility/night -> light; transport/evacuate/move people -> vehicle; " +
    "housing/warming/cooling/beds -> shelter; people/personnel/team/medical -> crew. " +
    "place is a Detroit street, intersection or landmark mentioned, else empty string. " +
    "If no kind is implied, use an empty array.";
  return askOpenAI([{role:"system",content:sys},{role:"user",content:question}], 160)
    .then(function(txt){
      var clean = txt.replace(/```json|```/g,"").trim();
      try{ return JSON.parse(clean); }catch(e){ return { kinds:[], status:"any", place:"", radius_miles:5 }; }
    });
}

function summarise(question, rows){
  if(!rows.length){
    return Promise.resolve("Nothing in the registry matches that. Widen the radius, or the " +
      "resource may simply not be posted yet.");
  }
  var facts = rows.slice(0,8).map(function(r){
    return "- " + r.name + " (" + r.agency + "), " + r.status +
      (r.distance_m != null ? (", " + fmtDist(r.distance_m) + " away") : "") +
      (r.capacity ? (", " + r.capacity) : "") +
      (r.contact ? (", contact " + r.contact) : "") +
      (r.minutes_since_update != null ? (", updated " + humanAge(r.minutes_since_update, r.updated_at)) : "");
  }).join("\n");
  var sys = "You are briefing an incident commander. Use ONLY the resource list given. Never " +
    "invent a resource, an agency or a contact. Two sentences maximum. Lead with the single " +
    "best option and who to call. If anything was updated more than 2 hours ago, say the " +
    "status is unverified. Report ages exactly as they are given to you — never convert them " +
    "into minutes.";
  return askOpenAI([{ role:"system", content:sys },
                    { role:"user", content:"Question: " + question + "\n\nResources:\n" + facts }], 180);
}

function showAnswer(html){
  document.getElementById("answer").innerHTML = html ? ('<div class="box">' + html + '</div>') : "";
}

/* The AI toggle: set a key, or clear it. Deliberately visible rather than buried, because a
   driver of this app should always be able to tell whether a question is being answered by a
   model or by a plain search — and be able to turn the model off. */
function refreshAiBtn(){
  var b = document.getElementById("aiBtn");
  if(!b) return;
  var on = !!CONFIG.openaiKey;
  b.classList.toggle("on", on);
  b.textContent = on ? "AI ON" : "AI OFF";
  b.title = on ? "Plain-language questions enabled — tap to remove the key"
               : "Tap to add an OpenAI key and enable plain-language questions";
}
document.getElementById("aiBtn").onclick = function(){
  if(CONFIG.openaiKey){
    if(confirm("Remove the stored OpenAI key from this browser?")){
      CONFIG.openaiKey = "";
      try{ localStorage.removeItem("cay_openai_key"); }catch(e){}
      refreshAiBtn();
      toastMsg("Key removed. Search still works — it just won't answer in plain language.");
    }
    return;
  }
  var k = prompt("Paste an OpenAI API key (sk-...).\n\nStored only in this browser, never in " +
                 "the repository. Clear it any time by tapping AI again.");
  if(!k) return;
  k = k.trim();
  if(k.indexOf("sk-") !== 0){ toastMsg("That doesn't look like an OpenAI key — it should start with sk-"); return; }
  CONFIG.openaiKey = k;
  try{ localStorage.setItem("cay_openai_key", k); }catch(e){}
  refreshAiBtn();
  toastMsg("AI on. Try: what can put water on a fire near Chene?");
};
refreshAiBtn();

/* ═══════════ ONE BOX, THREE KINDS OF INPUT ═══════════
   What the user typed decides the path, so they never have to:
     "42.33,-83.05"          → search that point, no network beyond the registry
     "pumps near Chene"      → the model reads intent and place, then the DATABASE answers
     "3000 E Jefferson"      → geocode, then search that point
   If the model isn't configured, it still works as plain search — the AI makes it better,
   it is not load-bearing. A demo that dies because one API is slow is not a demo. */
function findIt(){
  var text = document.getElementById("q").value.trim();
  if(!text){ loadAll(); showAnswer(""); return; }

  var btn = document.getElementById("go"), label = btn.textContent;
  function done(){ btn.textContent = label; btn.disabled = false; }
  btn.textContent = "…"; btn.disabled = true;

  // 1. coordinates typed directly
  var direct = parseLatLng(text);
  if(direct){ searchNear(direct.lat, direct.lng); showAnswer(""); done(); return; }

  // 2. no model configured → behave as a plain address search
  if(!CONFIG.openaiKey){
    tryGeocode(geocodeVariants(text), 0).then(function(hit){
      done();
      if(hit){ searchNear(hit.lat, hit.lng); showAnswer(""); return; }
      var c = map.getCenter();
      searchNear(c.lat, c.lng);
      toastMsg("Couldn't place that — showing what's near the centre of the map. Long-press the map to set a point.");
    });
    return;
  }

  // 3. full path: interpret → query the registry → summarise what came back
  showAnswer("Reading the registry…");
  interpret(text).then(function(q){
    var place = (q.place || "").trim();
    return (place ? tryGeocode(geocodeVariants(place), 0) : Promise.resolve(null))
      .then(function(hit){
        var c = hit || map.getCenter();
        var radius = Math.max(800, Math.round((q.radius_miles || 5) * 1609));
        return api("rpc/resources_near", { method:"POST", body:JSON.stringify({
            in_lat:c.lat, in_lng:c.lng, radius_m:radius,
            only_available:(q.status === "available") }) })
          .then(function(d){
            d = withAge(d);
            if(q.kinds && q.kinds.length) d = d.filter(function(r){ return q.kinds.indexOf(r.kind) > -1; });
            render(d);
            if(incidentMarker) incidentMarker.remove();
            incidentMarker = new maplibregl.Marker({ color:"#E5484D" })
              .setLngLat([c.lng, c.lat]).addTo(map);
            map.flyTo({ center:[c.lng, c.lat], zoom:13, duration:700 });
            return summarise(text, d).then(function(answer){
              /* Provenance under every answer. A number with no source is what gets a tool
                 distrusted the first time it is wrong. */
              var why = (q.kinds && q.kinds.length ? q.kinds.join(", ") : "all types") +
                " within " + (q.radius_miles || 5) + " mi of " +
                (hit ? place : "the map centre") + " · " + d.length +
                " match" + (d.length === 1 ? "" : "es") +
                " · from the registry, not the model's memory";
              showAnswer(esc(answer).replace(/\n/g,"<br>") +
                         '<span class="why">' + esc(why) + '</span>');
            });
          });
      });
  }).catch(function(e){
    showAnswer("Couldn't answer that. " + esc((e && e.message) || ""));
  }).then(done);
}

document.getElementById("go").onclick = findIt;
document.getElementById("q").addEventListener("keydown", function(e){
  if(e.key === "Enter") findIt();
});

var _toastT = null;
/* Not every message deserves the same treatment. An error is something the user must act on, so
   it waits to be dismissed. A confirmation is a receipt and holds long enough to be read. An
   informational note gets out of the way. One function, three behaviours, chosen by the caller. */
function toastMsg(msg, kind){
  var t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  kind = kind || "info";
  t.innerHTML = '<span>' + esc(msg) + '</span>' +
                (kind === "err" ? '<span class="x">TAP TO DISMISS</span>' : '');
  t.className = "on " + kind;
  clearTimeout(_toastT);
  if(kind !== "err"){
    _toastT = setTimeout(function(){ t.className = kind; }, kind === "ok" ? 6000 : 3500);
  }
  t.onclick = function(){ clearTimeout(_toastT); t.className = kind; };
}

/* ═══════════ THE COMMITMENT CHAIN ═══════════
   Every rule below is ALSO enforced in Postgres (commit.sql). The interface asks the right
   questions; the database refuses the wrong answers. That split is deliberate: a rule that lives
   only in a button can be clicked around, and in an incident a registry that lies is worse than
   one that is empty. Whatever the database says is what the user is told — errors come back as
   plain sentences, not codes. */
var _stCurrent = null;

/* ── agencies: abbreviations and suggestions ──
   Nobody in an incident types "Detroit Department of Public Works". They type DPW. So the list
   carries both, matching on either, and suggestions appear as you type. Fewer keystrokes is the
   small win; the real one is fewer variant spellings of the same agency in the data — "DFD Eng
   30" and "DFD Engine 30" are two agencies to a database and one to a human. */
var AGENCIES = [
  ["DFD",   "Detroit Fire Department"],
  ["DPD",   "Detroit Police Department"],
  ["DPW",   "Detroit Public Works"],
  ["DDOT",  "Detroit Department of Transportation"],
  ["EMS",   "Detroit EMS"],
  ["DTE",   "DTE Energy"],
  ["DWSD",  "Detroit Water & Sewerage"],
  ["GSD",   "General Services Department"],
  ["HOMELAND", "Detroit Homeland Security & Emergency Management"],
  ["MSP",   "Michigan State Police"],
  ["MDOT",  "Michigan DOT"],
  ["WCEM",  "Wayne County Emergency Management"],
  ["OCEM",  "Oakland County Emergency Management"],
  ["MCEM",  "Macomb County Emergency Management"]
];

function agencyMatches(q){
  q = (q||"").trim().toLowerCase();
  if(!q) return [];
  return AGENCIES.filter(function(a){
    return a[0].toLowerCase().indexOf(q) === 0 ||
           a[1].toLowerCase().indexOf(q) > -1;
  }).slice(0,5);
}

/* Attach suggestions to any input. Deliberately a plain list under the field rather than a
   native datalist: datalist renders differently on every browser and is unreliable on iOS, and
   this has to behave the same on whatever machine is plugged into the projector. */
function attachAgency(inputId){
  var inp = document.getElementById(inputId);
  if(!inp) return;
  var box = document.createElement("div");
  box.className = "acbox";
  inp.parentNode.appendChild(box);
  function close(){ box.className = "acbox"; box.innerHTML = ""; }
  inp.addEventListener("input", function(){
    var m = agencyMatches(inp.value);
    if(!m.length){ close(); return; }
    box.className = "acbox on";
    box.innerHTML = m.map(function(a){
      return '<div class="acrow" data-v="' + esc(a[0]) + '"><b>' + esc(a[0]) + '</b> ' +
             esc(a[1]) + '</div>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".acrow"), function(r){
      r.onclick = function(){ inp.value = r.dataset.v; close(); inp.focus(); };
    });
  });
  inp.addEventListener("blur", function(){ setTimeout(close, 180); });
}

function me(){ try{ return localStorage.getItem("cay_agency") || ""; }catch(e){ return ""; } }
function setMe(v){ try{ localStorage.setItem("cay_agency", v); }catch(e){} }

function rpc(fn, args){
  return api("rpc/" + fn, { method:"POST", body:JSON.stringify(args) })
    .then(function(res){
      var msg = (typeof res === "string") ? res : (res && res[0]) || "ok";
      if(msg !== "ok" && msg !== null) throw new Error(msg);   // the DB's own sentence
      return msg;
    });
}

function fld(id, label, ph, val){
  return '<div class="fld"><label>' + label + '</label>' +
         '<input id="' + id + '" placeholder="' + ph + '" value="' + (val||"") + '"></div>';
}

function openStatus(r){
  _stCurrent = r;
  document.getElementById("st_name").textContent = r.name;
  document.getElementById("st_meta").textContent =
    r.agency + (r.capacity ? (" · " + r.capacity) : "") +
    (r.contact ? (" · " + r.contact) : "") +
    (r.minutes_since_update != null ? (" · " + humanAge(r.minutes_since_update, r.updated_at)) : "");
  document.getElementById("st_body").innerHTML = bodyFor(r);
  wireBody(r);
  document.getElementById("status").classList.add("on");
}

/* What you can do depends on where it is. One obvious next action, never a list of states. */
function bodyFor(r){
  var mine = r.held_by && me() && r.held_by.toLowerCase() === me().toLowerCase();

  if(r.status === "out_of_service"){
    return '<p class="hint">Out of service' + (r.oos_reason ? (" — " + esc(r.oos_reason)) : "") +
      '. It will not appear as available until someone returns it to service and says what was ' +
      'done. A resource that silently reappears teaches everyone to distrust the board.</p>' +
      fld("b_by","Your agency","DPW Yard 3", me()) +
      fld("b_note","What was wrong, and what was done","Impeller replaced, tested at full flow") +
      '<button class="btn" id="a_back" style="width:100%">Return to service</button>';
  }

  if(r.status === "available"){
    return '<p class="hint">Committing takes it out of the available list until it is released. ' +
      'Three things are required, because they are the first three questions anyone else will ask.</p>' +
      fld("c_by","Your agency","DFD Battalion 5", me()) +
      fld("c_for","Incident","Structure fire, Jefferson &amp; Chene") +
      fld("c_dest","Destination","Jefferson &amp; Chene") +
      fld("c_eta","ETA in minutes (optional)","20") +
      '<button class="btn" id="a_commit" style="width:100%;margin-top:4px">Commit this resource</button>' +
      '<button class="btn ghost" id="a_oos" style="width:100%;margin-top:8px">Report out of service</button>';
  }

  var held = '<div class="held"><b>' + esc(r.held_by || "Another agency") + '</b> holds this' +
    (r.held_for ? (' for <b>' + esc(r.held_for) + '</b>') : '') +
    (r.destination ? ('<br>Destination: <b>' + esc(r.destination) + '</b>') : '') +
    (r.eta_minutes ? (' · ETA ' + r.eta_minutes + ' min') : '') + '</div>';

  if(!mine){
    return held + '<p class="hint">Only the holding agency can move this forward. If you need it, ' +
      'file a request against it.</p>' +
      fld("q_by","Your agency","DPW Yard 3", me()) +
      fld("q_note","Why you need it","Flooding at Kercheval") +
      '<button class="btn ghost" id="a_req" style="width:100%">Request it</button>';
  }

  if(r.status === "committed"){
    return held + '<p class="hint">Marking en route tells everyone it has left. The destination is ' +
      'already set, which is why this step is possible at all.</p>' +
      '<button class="btn" id="a_enroute" style="width:100%">Mark en route</button>' +
      '<button class="btn ghost" id="a_release" style="width:100%;margin-top:8px">Release — no longer needed</button>';
  }
  if(r.status === "en_route"){
    return held + '<p class="hint">Mark arrived when it reaches ' + esc(r.destination || "the scene") + '.</p>' +
      '<button class="btn" id="a_arrived" style="width:100%">Mark arrived</button>';
  }
  if(r.status === "arrived"){
    return held + '<p class="hint">On-site check. A pump that showed up broken is not a delivered ' +
      'resource, and the registry should say so rather than quietly counting it.</p>' +
      fld("k_by","Confirming agency","DFD Battalion 5", me()) +
      fld("k_note","Note (optional)","Primed and running at full flow") +
      '<div class="two"><button class="btn" id="a_ok" style="flex:1">Works — in use</button>' +
      '<button class="btn ghost" id="a_bad" style="flex:1">Not working</button></div>' +
      '<button class="btn ghost" id="a_release" style="width:100%;margin-top:8px">Release</button>';
  }
  return held;
}

function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ""; }

function after(msg){ closeStatus(); toastMsg(msg, "ok"); loadAll(); loadMine(); }

function wireBody(r){
  attachAgency("c_by"); attachAgency("q_by"); attachAgency("k_by"); attachAgency("b_by");
  var on = function(id, fn){ var e = document.getElementById(id); if(e) e.onclick = fn; };

  on("a_commit", function(){
    var by = val("c_by");
    if(!by){ toastMsg("Who is committing this?", "err"); return; }
    setMe(by);
    rpc("commit_resource", { in_id:r.id, in_actor:by, in_incident:val("c_for"),
        in_destination:val("c_dest"), in_eta: val("c_eta") ? parseInt(val("c_eta"),10) : null })
      .then(function(){
        after("COMMITTED · " + r.name + " → " + val("c_dest") + " · " +
              new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
      })
      .catch(function(e){ toastMsg(e.message, "err"); });
  });

  on("a_enroute", function(){
    rpc("advance_resource", { in_id:r.id, in_actor:me(), in_to:"en_route" })
      .then(function(){ after("EN ROUTE · " + r.name + " → " + (r.destination||"scene")); })
      .catch(function(e){ toastMsg(e.message, "err"); });
  });

  on("a_arrived", function(){
    rpc("advance_resource", { in_id:r.id, in_actor:me(), in_to:"arrived" })
      .then(function(){ after("ARRIVED · " + r.name + " at " + (r.destination||"scene")); })
      .catch(function(e){ toastMsg(e.message, "err"); });
  });

  on("a_ok", function(){
    var by = val("k_by") || me();
    if(!by){ toastMsg("Who is confirming this?", "err"); return; }
    setMe(by);
    rpc("confirm_arrival", { in_id:r.id, in_actor:by, in_working:true, in_note:val("k_note") })
      .then(function(){ after("VERIFIED · " + r.name + " operational · confirmed by " + by); })
      .catch(function(e){ toastMsg(e.message, "err"); });
  });

  on("a_bad", function(){
    var byBad = val("k_by") || me();
    if(!byBad){ toastMsg("Who is confirming this?", "err"); return; }
    setMe(byBad);
    rpc("confirm_arrival", { in_id:r.id, in_actor:byBad, in_working:false,
        in_note: val("k_note") || "failed on-site check" })
      .then(function(){ after("OUT OF SERVICE · " + r.name + " failed the on-site check"); })
      .catch(function(e){ toastMsg(e.message, "err"); });
  });

  on("a_release", function(){
    rpc("advance_resource", { in_id:r.id, in_actor:me(), in_to:"released" })
      .then(function(){ after("RELEASED · " + r.name + " back to available"); })
      .catch(function(e){ toastMsg(e.message, "err"); });
  });

  on("a_oos", function(){
    var why = prompt("Why is it out of service?");
    if(!why) return;
    rpc("mark_out_of_service", { in_id:r.id, in_actor: me() || "unattributed", in_reason:why })
      .then(function(){ after("OUT OF SERVICE · " + r.name); })
      .catch(function(e){ toastMsg(e.message, "err"); });
  });

  on("a_back", function(){
    var by = val("b_by");
    if(!by){ toastMsg("Who is returning this to service?", "err"); return; }
    setMe(by);
    rpc("return_to_service", { in_id:r.id, in_actor:by, in_note:val("b_note") })
      .then(function(){ after("BACK IN SERVICE · " + r.name + " · verified by " + by); })
      .catch(function(e){ toastMsg(e.message, "err"); });
  });

  on("a_req", function(){
    var by = val("q_by");
    if(!by){ toastMsg("Which agency is asking?", "err"); return; }
    setMe(by);
    var c = map.getCenter();
    api("requests", { method:"POST", headers:{Prefer:"return=minimal"},
      body: JSON.stringify({ resource_id:r.id, requested_by:by, note:val("q_note"),
                             lat:c.lat, lng:c.lng }) })
      .then(function(){ after("REQUEST SENT to " + r.held_by); })
      .catch(function(e){ toastMsg("Couldn't send: " + e.message, "err"); });
  });
}

function closeStatus(){
  document.getElementById("status").classList.remove("on");
  _stCurrent = null;
}
document.getElementById("st_close").onclick = closeStatus;
document.getElementById("status").onclick = function(e){
  if(e.target.id === "status") closeStatus();
};

document.getElementById("addBtn").onclick = function(){
  document.getElementById("add").classList.add("on");
};
document.getElementById("cancelAdd").onclick = function(){
  document.getElementById("add").classList.remove("on");
};
document.getElementById("saveAdd").onclick = function(){
  var c = map.getCenter();
  var body = {
    agency:   document.getElementById("f_agency").value.trim(),
    name:     document.getElementById("f_name").value.trim(),
    kind:     document.getElementById("f_kind").value,
    status:   document.getElementById("f_status").value,
    capacity: document.getElementById("f_capacity").value.trim() || null,
    contact:  document.getElementById("f_contact").value.trim() || null,
    lat: c.lat, lng: c.lng
  };
  if(!body.agency || !body.name){ alert("Agency and resource name are required."); return; }
  api("resources", { method:"POST", body:JSON.stringify(body),
      headers:{ "Prefer":"return=minimal" } })
    .then(function(){
      document.getElementById("add").classList.remove("on");
      ["f_agency","f_name","f_capacity","f_contact"].forEach(function(id){
        document.getElementById(id).value = "";
      });
      loadAll();
    })
    .catch(function(e){ alert("Could not post: " + (e && e.message)); });
};

/* ── sheet detents ──
   Three positions: full (list work), half (map and list together), peek (search only, map nearly
   full screen). Dragging and tapping both land on the same three, so there is never a state you
   can get into by dragging that you cannot get back out of by tapping. */
(function(){
  var sheet = document.getElementById("sheet");
  var grip  = sheet.querySelector(".grip");
  var det = [], idx = 2, startY = 0, startT = 0, dragging = false, moved = false;

  function measure(){
    var h = sheet.offsetHeight;
    /* full (everything), two-thirds (map + a good list), half, peek (search only, map open) */
    det = [0, Math.round(h * 0.34), Math.round(h * 0.56), h - 112];
    idx = Math.min(idx, det.length - 1);
    if(idx >= det.length) idx = det.length - 1;
    apply();
  }
  function apply(){ sheet.style.setProperty("--sheetY", det[idx] + "px"); }

  grip.addEventListener("pointerdown", function(e){
    dragging = true; moved = false;
    startY = e.clientY;
    startT = det[idx];
    sheet.classList.add("dragging");
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var dy = e.clientY - startY;
    if(Math.abs(dy) > 3) moved = true;
    var y = Math.max(det[0], Math.min(det[det.length-1], startT + dy));
    sheet.style.setProperty("--sheetY", y + "px");
  });
  function end(){
    if(!dragging) return;
    dragging = false;
    sheet.classList.remove("dragging");
    if(!moved){ idx = (idx + 1) % det.length; apply(); return; }   // tap cycles
    var cur = parseFloat(getComputedStyle(sheet).getPropertyValue("--sheetY")) || 0;
    var best = 0;
    det.forEach(function(d, i){ if(Math.abs(d - cur) < Math.abs(det[best] - cur)) best = i; });
    idx = best; apply();
  }
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);

  window.addEventListener("resize", measure);
  measure();
  setTimeout(measure, 300);
})();

map.on("load", function(){ loadAll(); loadRequests(); });
setInterval(loadRequests, 20000);   // an unanswered request should not need a refresh to appear
</script>
